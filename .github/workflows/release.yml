name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write     # GoReleaser needs to upload assets to the release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: checkout (with full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
