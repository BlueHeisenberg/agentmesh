name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # e2e test depends on mDNS multicast on loopback — runners may not deliver
      # that reliably, so we run with -short which lets the e2e test self-skip.
      - name: go test (-short)
        run: go test -timeout 60s -short ./...
