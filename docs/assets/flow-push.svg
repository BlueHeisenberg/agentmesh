<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="agentmesh push flow — how a peer's message auto-arrives at the user's next prompt">
  <defs>
    <pattern id="gridF" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8E6E1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8C674"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="#0A0908"/>
  <rect width="1200" height="360" fill="url(#gridF)" opacity="0.5"/>

  <!-- frame ticks -->
  <g stroke="#E8E6E1" stroke-width="1.5" fill="none">
    <path d="M24 36 L24 20 L56 20"/>
    <path d="M1176 36 L1176 20 L1144 20"/>
    <path d="M24 324 L24 340 L56 340"/>
    <path d="M1176 324 L1176 340 L1144 340"/>
  </g>

  <text x="40" y="44" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#7A7A7A" letter-spacing="2.4">flow · push delivery via UserPromptSubmit</text>

  <!-- five lane headers -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#E8E6E1" text-anchor="middle">
    <text x="120" y="86">peer</text>
    <text x="360" y="86">agentmesh</text>
    <text x="600" y="86">session store</text>
    <text x="840" y="86">UserPromptSubmit hook</text>
    <text x="1080" y="86">agent</text>
  </g>

  <!-- vertical lane lines -->
  <g stroke="#3A3A3A" stroke-width="1" stroke-dasharray="2 4">
    <line x1="120" y1="100" x2="120" y2="320"/>
    <line x1="360" y1="100" x2="360" y2="320"/>
    <line x1="600" y1="100" x2="600" y2="320"/>
    <line x1="840" y1="100" x2="840" y2="320"/>
    <line x1="1080" y1="100" x2="1080" y2="320"/>
  </g>

  <!-- step 1: peer -> agentmesh : mesh_send -->
  <line x1="120" y1="130" x2="354" y2="130" stroke="#E8E6E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="180" y="115" width="120" height="18" fill="#0A0908"/>
  <text x="240" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8E6E1">mesh_send</text>

  <!-- step 2: agentmesh -> session store : append to inbox.jsonl -->
  <line x1="360" y1="170" x2="594" y2="170" stroke="#E8E6E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="400" y="155" width="160" height="18" fill="#0A0908"/>
  <text x="480" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8E6E1">append to inbox.jsonl</text>

  <!-- caption between session store and hook: user types ANY prompt -->
  <g>
    <rect x="618" y="195" width="208" height="36" fill="#0A0908" stroke="#E8C674" stroke-width="1" stroke-dasharray="3 3" rx="2"/>
    <text x="722" y="211" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8C674">user types ANY prompt</text>
    <text x="722" y="225" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#A6A39E">— triggers hook —</text>
  </g>

  <!-- step 3: session store -> hook : read unread -->
  <line x1="600" y1="250" x2="834" y2="250" stroke="#E8E6E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="650" y="235" width="120" height="18" fill="#0A0908"/>
  <text x="710" y="248" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8E6E1">read unread</text>

  <!-- step 4: hook -> agent : prepended to next prompt -->
  <line x1="840" y1="280" x2="1074" y2="280" stroke="#E8E6E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="870" y="265" width="180" height="18" fill="#0A0908"/>
  <text x="960" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8E6E1">prepended to next prompt</text>

  <!-- step 5: agent -> peer (return arc back to leftmost lane) -->
  <path d="M1080 305 L120 305" fill="none" stroke="#E8C674" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <rect x="500" y="290" width="200" height="18" fill="#0A0908"/>
  <text x="600" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8C674">responds in same turn (mesh_send)</text>
</svg>
