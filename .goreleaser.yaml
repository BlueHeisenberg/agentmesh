# GoReleaser config — see https://goreleaser.com
version: 2

project_name: agentmesh

before:
  hooks:
    - go mod tidy

builds:
  - id: agentmesh
    main: ./cmd/agentmesh
    binary: agentmesh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "agentmesh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: BlueHeisenberg
    name: agentmesh
  draft: false
  prerelease: auto
  header: |
    ## agentmesh {{ .Tag }}

    LAN-native P2P for AI agents — mDNS discovery, mTLS over Ed25519, MCP-native.

    ### Install

    One-liner:
    ```bash
    curl -fsSL https://blueheisenberg.github.io/agentmesh/install.sh | sh
    ```

    Or grab the right archive from the assets below.
  footer: |
    ---
    Built with [GoReleaser](https://goreleaser.com).
